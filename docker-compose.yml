services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: mrv
      POSTGRES_USER: mrv
      POSTGRES_PASSWORD: mrv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.django
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment: &app-env
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgresql://mrv:mrv@db:5432/mrv
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    command: uvicorn ingestion.main:app --host 0.0.0.0 --port 8001
    environment: *app-env
    ports:
      - "8001:8001"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8001
    ports:
      - "3000:80"
    depends_on:
      - ingestion

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.django
    command: celery -A config worker --loglevel=info
    environment: *app-env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
