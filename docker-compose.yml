services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: mrv
      POSTGRES_USER: mrv
      POSTGRES_PASSWORD: mrv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrv -d mrv && psql -U mrv -d mrv -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "6380:6379"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.django
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment: &app-env
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgresql://mrv:mrv@db:5432/mrv
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "migrate", "--check"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    command: uvicorn ingestion.main:app --host 0.0.0.0 --port 8001
    environment: *app-env
    ports:
      - "8001:8001"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    ports:
      - "3000:80"
    depends_on:
      ingestion:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.django
    command: celery -A config worker --loglevel=info
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
